# Place inside nginx's http context, for example /etc/nginx/conf.d/clex-mqtt.conf.
# Replace mqtt.example.com and certificate paths before enabling this template.
# Set CLEX_HTTP_TRUSTED_PROXY_IPS=127.0.0.1,::1 for this local proxy.
# X-Real-IP must overwrite any header supplied by the external client.
server {
    listen 80;
    listen [::]:80;
    server_name mqtt.example.com;
    return 301 https://mqtt.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mqtt.example.com;

    ssl_certificate /etc/letsencrypt/live/mqtt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Scrape the loopback listener or a private monitoring route.
    location = /metrics { return 404; }
    client_max_body_size 16k;

    # MQTT over WebSocket. MQTT authentication is still performed by the broker.
    location = /mqtt {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
