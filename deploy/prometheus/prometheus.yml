# Local/private targets. Supply monitoring credentials through the secret store.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - clex-mqtt-alerts.yml
  - host-alerts.yml
  - backup-alerts.yml

# Enable after configuring the private Alertmanager receiver.
# alerting:
#   alertmanagers:
#     - api_version: v2
#       static_configs:
#         - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: clex-mqtt
    scrape_timeout: 5s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/clex-mqtt-token
    static_configs:
      - targets: ['127.0.0.1:8085']
