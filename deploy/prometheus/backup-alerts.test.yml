        {
          "eval_time": "3m",
          "alertname": "ClexMqttBackupFailed",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "node",
                "instance": "127.0.0.1:9100",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Резервное копирование завершилось ошибкой",
                "description": "Проверьте журнал clex-mqtt-backup.service; следующая успешная попытка снимет предупреждение."
              }
            }
          ]
        },
        {
          "eval_time": "3m",
          "alertname": "ClexMqttBackupStale",
          "exp_alerts": []
        },
        {
          "eval_time": "3m",
          "alertname": "ClexMqttBackupStatusUnavailable",
          "exp_alerts": []
        }
