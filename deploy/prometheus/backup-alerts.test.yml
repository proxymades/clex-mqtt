{
  "rule_files": [
    "backup-alerts.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"node\",instance=\"127.0.0.1:9100\"}",
          "values": "1+0x1800"
        },
        {
          "series": "clex_mqtt_backup_last_run_success{job=\"node\",instance=\"127.0.0.1:9100\"}",
          "values": "1+0x1800"
        },
        {
          "series": "clex_mqtt_backup_last_success_timestamp_seconds{job=\"node\",instance=\"127.0.0.1:9100\"}",
          "values": "0+0x1800"
        },
        {
          "series": "clex_mqtt_backup_status_timestamp_seconds{job=\"node\",instance=\"127.0.0.1:9100\"}",
          "values": "0+60x1800"
        },
        {
          "series": "clex_mqtt_backup_status_collection_success{job=\"node\",instance=\"127.0.0.1:9100\"}",
          "values": "1+0x1800"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "ClexMqttBackupFailed",
          "exp_alerts": []
        },
        {
          "eval_time": "10m",
          "alertname": "ClexMqttBackupStale",
          "exp_alerts": []
        },
        {
          "eval_time": "10m",
          "alertname": "ClexMqttBackupStatusUnavailable",
          "exp_alerts": []
        }
      ]
    },
